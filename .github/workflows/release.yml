name: Release

# Fully automates what used to be a manual build-APK / upload-to-GitHub / edit-update.json
# process. A developer bumps versionCode + versionName in app/build.gradle.kts and adds
# the release's notes under the "## [Unreleased]" heading in CHANGELOG.md, then pushes to
# main. This workflow builds the signed APK, tags the release, publishes it on GitHub,
# rolls the changelog's Unreleased section into a versioned one, and regenerates
# update.json (versionCode, versionName, downloadUrl, sha256, releaseNotes) — which is
# what devices actually read (via raw.githubusercontent.com) to detect the update.
on:
  push:
    branches: [main]
    paths:
      - app/build.gradle.kts

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from app/build.gradle.kts
        id: version
        run: |
          NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          if [ -z "$NAME" ] || [ -z "$CODE" ]; then
            echo "::error::couldn't read versionName/versionCode from app/build.gradle.kts"
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$NAME" >> "$GITHUB_OUTPUT"

      - name: Skip if this version was already released
        id: check
        run: |
          if git rev-parse -q --verify "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null; then
            echo "Tag ${{ steps.version.outputs.tag }} already exists — versionName wasn't bumped, nothing to do."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Roll CHANGELOG.md Unreleased section into this version
        if: steps.check.outputs.should_release == 'true'
        id: changelog
        run: |
          python3 - "${{ steps.version.outputs.name }}" <<'PYEOF'
          import re, sys

          version_name = sys.argv[1]
          path = "CHANGELOG.md"
          text = open(path, encoding="utf-8").read()

          heading_re = re.compile(r'^## \[.+?\]\s*$', re.MULTILINE)
          headings = list(heading_re.finditer(text))
          unreleased = next((m for m in headings if m.group().strip() == "## [Unreleased]"), None)
          if unreleased is None:
              sys.exit("::error::CHANGELOG.md has no '## [Unreleased]' section")

          later = [m for m in headings if m.start() > unreleased.start()]
          section_end = later[0].start() if later else len(text)
          body = text[unreleased.end():section_end].strip("\n")

          if not body.strip():
              sys.exit("::error::CHANGELOG.md's Unreleased section is empty — add release notes before bumping the version")

          with open("release_notes.md", "w", encoding="utf-8") as f:
              f.write(body + "\n")

          new_section_header = f"## [Unreleased]\n\n## [{version_name}]"
          new_text = text[:unreleased.start()] + new_section_header + text[unreleased.end():]
          open(path, "w", encoding="utf-8").write(new_text)
          PYEOF

      - uses: actions/setup-java@v4
        if: steps.check.outputs.should_release == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.check.outputs.should_release == 'true'

      - name: Configure release signing
        if: steps.check.outputs.should_release == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 (and the matching password/alias secrets) must be set in repo secrets to build a properly signed release APK. See app/build.gradle.kts signingConfigs."
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          cat >> local.properties <<EOF
          RELEASE_STORE_FILE=$KEYSTORE_PATH
          RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD
          RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS
          RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD
          EOF

      - name: Assemble release APK
        if: steps.check.outputs.should_release == 'true'
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Create tag
        if: steps.check.outputs.should_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub release
        if: steps.check.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            app/build/outputs/apk/release/app-release.apk \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file release_notes.md

      - name: Regenerate update.json
        if: steps.check.outputs.should_release == 'true'
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          APK_SHA256=$(sha256sum app/build/outputs/apk/release/app-release.apk | cut -d' ' -f1)
          DOWNLOAD_URL="https://github.com/$GH_REPO/releases/download/${{ steps.version.outputs.tag }}/app-release.apk"
          jq -n \
            --argjson versionCode "${{ steps.version.outputs.code }}" \
            --arg versionName "${{ steps.version.outputs.name }}" \
            --arg downloadUrl "$DOWNLOAD_URL" \
            --arg sha256 "$APK_SHA256" \
            --arg releaseNotes "$(cat release_notes.md)" \
            '{versionCode: $versionCode, versionName: $versionName, downloadUrl: $downloadUrl, releaseNotes: $releaseNotes, sha256: $sha256}' \
            > update.json

      - name: Commit update.json and CHANGELOG.md
        if: steps.check.outputs.should_release == 'true'
        run: |
          rm -f release_notes.md
          git add update.json CHANGELOG.md
          git commit -m "chore: update.json for ${{ steps.version.outputs.tag }}"
          git push origin HEAD:main
