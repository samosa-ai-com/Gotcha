name: CI

# CI is DISABLED by default to conserve GitHub Actions budget. The automatic
# triggers (push / pull_request / schedule) are intentionally removed; the
# nightly full-matrix job no longer runs. The workflow can still be triggered
# manually via Actions → Run workflow (opt-in, consumes budget), but prefer the
# equivalent local commands in docs/RUNNING_TESTS.md.

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    runs-on: ubuntu-latest # TerminalToolTest shells out to POSIX `sh` — do not move to windows/macos
    timeout-minutes: 30
    # The coverage comment needs pull-requests: write. Without it the jacoco-report
    # action fails with "Resource not accessible by integration" — and because that
    # action defaults to continue-on-error, the step still reports success, so the
    # comment silently never appears.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Robolectric downloads an android-all jar per @Config(sdk = ...) level on first
      # run; without this every fresh runner pays that download again.
      - name: Cache Robolectric android-all jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('app/build.gradle.kts') }}
          restore-keys: robolectric-

      # No baselines: the whole repo must pass detekt and lint on every run.
      - name: Detekt
        run: ./gradlew :app:detekt --stacktrace

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # Report-only: the feature-coverage manifest is the gate, not a percentage.
      # See the comment on the kover block in app/build.gradle.kts.
      - name: Coverage report
        run: ./gradlew :app:koverXmlReport :app:koverHtmlReport --stacktrace

      # Kover emits JaCoCo-format XML, so this action reads it directly. Thresholds are 0
      # on purpose — it posts total + changed-files coverage and never fails the build.
      - name: Post coverage on the PR
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.7
        with:
          paths: app/build/reports/kover/report.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 0
          min-coverage-changed-files: 0
          title: Coverage (report-only — the feature manifest is the gate)
          # Left at the action's default (true) on purpose: per the plan, coverage must
          # never gate the build. Note the consequence — if the comment fails to post
          # (e.g. the pull-requests: write grant above is ever removed), the step still
          # reports success and the comment silently disappears. Check the step log,
          # not its status, if the comment stops appearing.

      - name: Android Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/testDebugUnitTest/
          retention-days: 14

  # GMD's own emulator handling never booted on these runners and swallowed
  # the emulator's stderr; running the same emulator via emulator-runner
  # surfaced the real error: "FATAL | Not enough space to create userdata
  # partition. Available: 6508 MB, need 7372 MB" — the runner disk is nearly
  # full, hence the "Free disk space" step. emulator-runner stays because it
  # boots/waits for the AVD itself and actually reports emulator output;
  # GMD remains the local workflow. Device configs mirror the GMD definitions
  # in app/build.gradle.kts.
  instrumented-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The emulator needs ~7.4 GB free for the userdata partition alone, plus
      # the system image and AVD cache. Drop preinstalled toolchains we never
      # use (~15-25 GB). Do NOT delete /opt/hostedtoolcache wholesale — that's
      # where setup-java installs the JDK.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc \
            /usr/local/.ghcup /usr/local/share/powershell \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Cache the system image, the AVD, and its boot snapshot so runs after
      # the first skip the ~1 GB image download and the slow cold boot. The
      # snapshot is generated once on cache miss (the echo-only runner step),
      # and test runs boot from it with -no-snapshot-save so the cached clean
      # state is never overwritten.
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
            /usr/local/lib/android/sdk/system-images/*
          key: avd-34-aosp_atd-pixel_6

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: aosp_atd
          profile: pixel_6
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: echo "Generated AVD snapshot for caching."

      - name: Run smoke instrumented tests (API 34)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: aosp_atd
          profile: pixel_6
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-smoke-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 14

  # Sharding (-Pandroid.testInstrumentationRunnerArguments.numShards/shardIndex plus a
  # `shard` matrix axis) is deliberately deferred until the instrumented suite exceeds
  # ~20 tests; at 6 tests it would cost more in emulator boots than it saves.
  # The full matrix only runs on a manual workflow_dispatch now that the
  # nightly schedule is removed.
  instrumented-full:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Mirrors the GMD "full" group in app/build.gradle.kts. API 30 (the
        # app's minSdk) uses the plain default image — no usable ATD image at
        # that level, see the notes in build.gradle.kts; 33/34/35 use ATD.
        # API 36 has no ATD image published yet, so it uses google_apis.
        include:
          - api-level: 30
            target: default
            profile: pixel_2
          - api-level: 33
            target: aosp_atd
            profile: pixel_6
          - api-level: 34
            target: aosp_atd
            profile: pixel_6
          - api-level: 35
            target: aosp_atd
            profile: pixel_8
          - api-level: 36
            target: google_apis
            profile: pixel_8
    steps:
      - uses: actions/checkout@v4

      # See the note on the same step in instrumented-smoke.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc \
            /usr/local/.ghcup /usr/local/share/powershell \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Same caching scheme as instrumented-smoke; the api-34 key is shared
      # with that job since the AVD definition is identical.
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
            /usr/local/lib/android/sdk/system-images/*
          key: avd-${{ matrix.api-level }}-${{ matrix.target }}-${{ matrix.profile }}

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: ${{ matrix.target }}
          profile: ${{ matrix.profile }}
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: echo "Generated AVD snapshot for caching."

      - name: Run instrumented tests (API ${{ matrix.api-level }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: ${{ matrix.target }}
          profile: ${{ matrix.profile }}
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-full-reports-api${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 14
