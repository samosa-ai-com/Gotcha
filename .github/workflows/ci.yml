name: CI

on:
  push:
    branches: [master, development]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    runs-on: ubuntu-latest # TerminalToolTest shells out to POSIX `sh` — do not move to windows/macos
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Baselined against existing findings (app/detekt-baseline.xml); regenerate
      # locally with: ./gradlew :app:detektBaseline
      - name: Detekt
        run: ./gradlew :app:detekt --stacktrace

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # Baselined against existing findings (app/lint-baseline.xml); regenerate
      # locally with: ./gradlew :app:updateLintBaseline
      - name: Android Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/testDebugUnitTest/
          retention-days: 14
