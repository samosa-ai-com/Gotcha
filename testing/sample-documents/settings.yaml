# Project Falcon — runtime configuration

app:
  name: Gotcha
  environment: staging
  debug: true

server:
  host: 0.0.0.0
  port: 8080
  workers: 4
  timeouts:
    connect: 5
    read: 30
    write: 30

database:
  engine: sqlite
  path: /var/lib/falcon/falcon.db
  pool_size: 10
  backups: true

llm:
  max_attachment_chars: 40000
  default_model: falcon-3b
  temperature: 0.3

flags:
  document_attachments: true
  share_sheet_integration: true
  legacy_doc_support: false
